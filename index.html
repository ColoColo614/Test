<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Plumber Run 1.4</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2f6ad7, #0e1f4d 70%);
      }

      .game-shell {
        text-align: center;
        color: #f6f8ff;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.6rem;
      }

      p {
        margin: 0.2rem 0;
        font-size: 0.95rem;
      }

      canvas {
        margin-top: 0.75rem;
        border: 3px solid #f6f8ff;
        border-radius: 8px;
        background: linear-gradient(#7dc6ff 0 60%, #5ec16f 60%);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      }

      .hint {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <h1>Mini Plumber Run 1.4</h1>
      <p>Beat 3 longer levels, use pipes, and stomp faster enemies.</p>
      <p class="hint">Controls: ← → move, Space / ↑ jump, ↓ enter pipe, R restart.</p>
      <canvas id="game" width="960" height="540" aria-label="Mario-like platform game"></canvas>
    </main>

    <script src="game.js"></script>
  </body>
</html>
